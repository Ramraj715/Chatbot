<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Aurora Chatbot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root{
      color-scheme: light dark;
      --bg-gradient: radial-gradient(circle at top left,#3b3f65 0%,#131528 35%,#05070f 100%);
      --panel: rgba(17, 19, 35, 0.68);
      --panel-border: rgba(255,255,255,0.08);
      --accent: #7dd3fc;
      --accent-strong: #38bdf8;
      --user-bubble: linear-gradient(135deg,#60a5fa,#2563eb);
      --bot-bubble: rgba(255,255,255,0.12);
      --text-primary: #f8fafc;
      --text-secondary: rgba(248,250,252,0.7);
      --input-bg: rgba(15, 23, 42, 0.9);
      --shadow: 0 18px 36px rgba(15,23,42,0.35);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg-gradient);
      color:var(--text-primary);
    }

    .chatbot{
      width:min(420px,100%);
      display:flex;
      flex-direction:column;
      gap:0;
      border-radius:28px;
      padding:28px 20px 22px;
      background:var(--panel);
      border:1px solid var(--panel-border);
      backdrop-filter: blur(22px);
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .chatbot::before{
      content:'';
      position:absolute;
      inset:0;
      background:radial-gradient(circle at 20% 20%,rgba(125,211,252,0.18),transparent 60%);
      pointer-events:none;
    }

    .chat-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 6px 22px;
      z-index:1;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-avatar{
      width:46px;
      height:46px;
      border-radius:16px;
      background:linear-gradient(135deg,#38bdf8,#22d3ee);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:20px;
      color:#0f172a;
      box-shadow:0 10px 25px rgba(56,189,248,0.35);
      overflow:hidden;
    }

    .brand-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .brand-text strong{
      font-size:18px;
      letter-spacing:0.3px;
    }

    .brand-text span{
      font-size:13px;
      color:var(--text-secondary);
    }

    .brand-text small{
      font-size:12px;
      color:rgba(248,250,252,0.55);
      letter-spacing:0.25px;
    }

    .status-chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 12px;
      border-radius:999px;
      background:rgba(125,211,252,0.12);
      color:var(--accent);
      font-size:13px;
      font-weight:500;
      letter-spacing:0.2px;
    }

    .status-chip span{
      display:block;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 12px rgba(125,211,252,0.8);
    }

    .chat-body{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:16px;
      padding:0 4px 18px;
      overflow-y:auto;
      scroll-behavior:smooth;
    }

    .chat-body::-webkit-scrollbar{
      width:8px;
    }

    .chat-body::-webkit-scrollbar-track{
      background:transparent;
    }

    .chat-body::-webkit-scrollbar-thumb{
      background:rgba(148,163,184,0.35);
      border-radius:999px;
    }

    .message{
      display:flex;
      align-items:flex-start;
      gap:12px;
      width:100%;
      animation:fadeUp 220ms ease;
    }

    .message--user{
      justify-content:flex-end;
    }

    .message--user .bubble{
      background:var(--user-bubble);
      color:#fff;
      border-bottom-right-radius:8px;
      border-bottom-left-radius:18px;
      box-shadow:0 12px 24px rgba(37,99,235,0.35);
    }

    .message--bot .bubble{
      background:var(--bot-bubble);
      border-bottom-left-radius:8px;
      border-bottom-right-radius:18px;
      border:1px solid rgba(255,255,255,0.04);
    }

    .bubble{
      padding:14px 16px 16px;
      border-radius:18px;
      font-size:14px;
      line-height:1.55;
      letter-spacing:0.15px;
      max-width:92%;
      position:relative;
      backdrop-filter:blur(2px);
      white-space:pre-line;
    }

    .bubble time{
      display:block;
      margin-top:10px;
      font-size:11px;
      color:var(--text-secondary);
      letter-spacing:0.4px;
    }

    .avatar{
      width:38px;
      height:38px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      background:rgba(148,163,184,0.12);
      color:var(--accent);
      font-weight:600;
      letter-spacing:0.4px;
      box-shadow:0 6px 20px rgba(15,23,42,0.25);
    }

    .message--user .avatar{
      order:2;
      background:rgba(96,165,250,0.15);
      color:#bfdbfe;
    }

    .typing{
      display:flex;
      align-items:center;
      gap:10px;
      margin-left:50px;
      color:var(--text-secondary);
      font-size:13px;
      letter-spacing:0.3px;
      opacity:0;
      transform:translateY(6px);
      transition:opacity 0.2s ease,transform 0.2s ease;
    }

    .typing--visible{
      opacity:1;
      transform:translateY(0);
    }

    .typing span{
      width:6px;
      height:6px;
      border-radius:50%;
      background:rgba(148,163,184,0.65);
      animation:typing 1s infinite ease-in-out;
    }

    .typing span:nth-child(2){
      animation-delay:0.2s;
    }

    .typing span:nth-child(3){
      animation-delay:0.4s;
    }

    .chat-footer{
      margin-top:auto;
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:14px 6px 0;
      border-top:1px solid rgba(148,163,184,0.14);
    }

    .input-row{
      display:flex;
      align-items:center;
      gap:12px;
      background:var(--input-bg);
      border-radius:20px;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:inset 0 0 0 1px rgba(15,23,42,0.35);
    }

    .input-row input{
      flex:1;
      border:none;
      background:transparent;
      color:var(--text-primary);
      font-size:14px;
      font-family:inherit;
      letter-spacing:0.2px;
      outline:none;
    }

    .input-row input::placeholder{
      color:rgba(148,163,184,0.55);
    }

    .input-row button{
      border:none;
      border-radius:16px;
      padding:10px 18px;
      background:var(--accent-strong);
      color:#0f172a;
      font-weight:600;
      font-size:14px;
      letter-spacing:0.3px;
      cursor:pointer;
      transition:transform 0.15s ease,box-shadow 0.2s ease;
      box-shadow:0 12px 22px rgba(56,189,248,0.35);
    }

    .input-row button:disabled{
      opacity:0.6;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .input-row button:not(:disabled):hover{
      transform:translateY(-2px);
      box-shadow:0 16px 28px rgba(56,189,248,0.45);
    }

    .suggestions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .suggestions button{
      padding:8px 14px;
      border-radius:14px;
      border:1px solid rgba(148,163,184,0.2);
      background:rgba(148,163,184,0.12);
      color:var(--text-secondary);
      font-size:12px;
      letter-spacing:0.2px;
      cursor:pointer;
      transition:all 0.2s ease;
    }

    .suggestions button:hover{
      background:rgba(148,163,184,0.22);
      color:var(--accent);
      border-color:rgba(125,211,252,0.35);
    }

    .toolbar{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      font-size:12px;
      color:var(--text-secondary);
    }

    .toolbar button{
      border:none;
      background:none;
      color:inherit;
      cursor:pointer;
      padding:6px 0;
      transition:color 0.2s ease;
    }

    .toolbar button:hover{
      color:var(--accent);
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes typing{
      0%,80%,100%{opacity:0.4;transform:translateY(0);}
      40%{opacity:1;transform:translateY(-3px);}
    }

    @media (max-width:520px){
      body{
        padding:18px;
      }
      .chatbot{
        border-radius:22px;
        padding:24px 18px;
      }
    }
  </style>
</head>
<body>
  <main class="chatbot" aria-label="Aurora virtual assistant">
    <header class="chat-header">
      <div class="brand">
        <span class="brand-avatar" aria-hidden="true">
          <img src="ramraj.png" alt="Mr. Ramraj Rajbanshi"/>
        </span>
        <div class="brand-text">
          <strong>Learn English ChatBot</strong>
          <span>Your personal study guide</span>
          <small>Designed by Mr. Ramraj Rajbanshi</small>
        </div>
      </div>
      <div class="status-chip" role="status" aria-live="polite">
        <span></span>
        Online
      </div>
    </header>

    <section class="chat-body" id="messageList" aria-live="polite" aria-label="Chat conversation">
    </section>

    <div id="typingIndicator" class="typing" role="status" aria-live="polite" aria-hidden="true">
      <span></span><span></span><span></span>
      Aurora is typing…
    </div>

    <footer class="chat-footer">
      <div class="toolbar">
        <button type="button" id="resetChat" aria-label="Clear conversation history">Reset chat</button>
      </div>
      <div class="suggestions" id="quickReplies" aria-label="Quick prompts">
      </div>
      <form class="input-row" id="chatForm" autocomplete="off">
        <input id="userInput" name="message" type="text" placeholder="Ask me anything..." required minlength="1" />
        <button type="submit" id="sendButton">Send</button>
      </form>
    </footer>
  </main>

  <script>
    const messageList = document.getElementById('messageList');
    const typingIndicator = document.getElementById('typingIndicator');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    const resetChat = document.getElementById('resetChat');
    const quickReplies = document.getElementById('quickReplies');

    const quickReplyOptions = [
      '/define_noun',
      '/types_of_verbs',
      '/tense_explanation',
      '/articles_usage',
      '/conditional_sentences',
      '/voice_chart',
      '/literary_periods',
      '/poetic_devices',
      '/types_of_drama',
      '/vowel_sounds',
      '/nepali_vowels',
      '/story_elements',
      '/types_of_novel',
      '/ielts_preparation_plan',
      '/sat_preparation_plan',
      'Give me English grammar tips',
      'Explain English education in Nepal',
      'How can I improve spoken English?',
      'Suggest literature essay topics',
      'Provide pronunciation tips'
    ];

    const openingMessage = [
      'Hello! I focus on English learning, teaching, literature, grammar, and exam preparation. Ask me anything in that space.'
    ];

    function createMessageElement(author, text){
      const wrapper = document.createElement('div');
      wrapper.className = `message message--${author}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden','true');
      avatar.textContent = author === 'user' ? 'You' : 'Au';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const time = document.createElement('time');
      time.dateTime = new Date().toISOString();
      time.textContent = formatTime(new Date());
      bubble.appendChild(time);

      if(author === 'user'){
        wrapper.appendChild(bubble);
        wrapper.appendChild(avatar);
      }else{
        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
      }

      return wrapper;
    }

    function appendMessage(author, text){
      const message = createMessageElement(author, text);
      messageList.appendChild(message);
      messageList.scrollTop = messageList.scrollHeight;
    }

    function toggleTypingIndicator(show){
      typingIndicator.classList.toggle('typing--visible', show);
      typingIndicator.setAttribute('aria-hidden', show ? 'false' : 'true');
    }

    function formatTime(date){
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function handleQuickReply(text){
      userInput.value = text;
      userInput.focus();
      handleSubmit(text);
    }

    function seedQuickReplies(){
      quickReplyOptions.forEach(option => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = option;
        button.addEventListener('click', () => handleQuickReply(option));
        quickReplies.appendChild(button);
      });
    }

    function initializeConversation(){
      openingMessage.forEach(text => appendMessage('bot', text));
    }

    function normalize(text){
      return text.toLowerCase().trim();
    }

    const commandResponses = {

      '/define_adjective': 'An adjective describes or modifies a noun or pronoun by giving more detail.\nExamples: bright, courageous, Nepali, three.',
      '/define_adverb': 'An adverb modifies a verb, adjective, or another adverb, often showing manner, time, place, or degree.\nExamples: quickly, quite, here, yesterday.',
      '/define_pronoun': 'A pronoun replaces a noun to avoid repetition.\nExamples: he, she, it, they, which, someone.',
      '/define_preposition': 'A preposition shows the relationship between a noun/pronoun and another word in the sentence.\nExamples: on, between, during, without.',
      '/define_conjunction': 'A conjunction links words, phrases, or clauses.\nCoordinating: and, but, or. Subordinating: because, although, unless.',

| If + past simple, would have + past part.   | If I were taller, I would have joined the basketball team.     | Present/future condition affecting past result',
      '/voice_chart': 'Active vs passive forms by tense:\n\nTense               | Active Voice                               | Passive Voice                                          | Notes / Example\n--------------------|---------------------------------------------|--------------------------------------------------------|----------------------------------------------------------------\nPresent Simple      | Subject + base verb(s/es) + object          | Object + is/are + past participle (+ by subject)       | Active: She writes a letter. Passive: A letter is written by her.\nPresent Continuous  | Subject + is/am/are + verb-ing + object     | Object + is/are + being + past participle              | Active: She is writing a letter. Passive: A letter is being written by her.\nPresent Perfect     | Subject + has/have + past participle + obj. | Object + has/have + been + past participle             | Active: She has written a letter. Passive: A letter has been written by her.\nPast Simple         | Subject + past verb + object                | Object + was/were + past participle                    | Active: She wrote a letter. Passive: A letter was written by her.\nPast Continuous     | Subject + was/were + verb-ing + object      | Object + was/were + being + past participle            | Active: She was writing a letter. Passive: A letter was being written by her.\nPast Perfect        | Subject + had + past participle + object    | Object + had + been + past participle                  | Active: She had written a letter. Passive: A letter had been written by her.\nFuture Simple       | Subject + will + base verb + object         | Object + will be + past participle                     | Active: She will write a letter. Passive: A letter will be written by her.\nFuture Continuous   | Subject + will be + verb-ing + object       | (Rarely used in passive)                               | Active: She will be writing a letter. Passive form seldom used.\nFuture Perfect      | Subject + will have + past participle + obj.| Object + will have been + past participle              | Active: She will have written a letter. Passive: A letter will have been written by her.',

      '/direct_to_indirect': 'Change reporting verb tense, pronouns, time expressions, and remove quotation marks.\nExample: Direct “She said, ‘I am studying.’” → Indirect “She said that she was studying.”',
      '/indirect_to_direct': 'Restore quotation marks, adjust pronouns/time words, and shift verb tense back if needed.\nExample: Indirect “He said that he would call me.” → Direct “He said, ‘I will call you.’”',
      '/tense_explanation': 'English has 12 major tenses across three time frames (present, past, future) and four aspects (simple, continuous, perfect, perfect continuous).\n\n| Tense | Aspect | Structure | Example |\n| --- | --- | --- | --- |\n| Present | Simple | Subject + base verb (s/es) | She writes a letter. |\n|  | Continuous | Subject + is/am/are + verb-ing | She is writing a letter. |\n|  | Perfect | Subject + has/have + past participle | She has written a letter. |\n|  | Perfect Continuous | Subject + has/have + been + verb-ing | She has been writing a letter. |\n| Past | Simple | Subject + past verb | She wrote a letter. |\n|  | Continuous | Subject + was/were + verb-ing | She was writing a letter. |\n|  | Perfect | Subject + had + past participle | She had written a letter. |\n|  | Perfect Continuous | Subject + had + been + verb-ing | She had been writing a letter. |\n| Future | Simple | Subject + will/shall + base verb | She will write a letter. |\n|  | Continuous | Subject + will be + verb-ing | She will be writing a letter. |\n|  | Perfect | Subject + will have + past participle | She will have written a letter. |\n|  | Perfect Continuous | Subject + will have been + verb-ing | She will have been writing a letter. |\n\nUse this table as a quick reference when forming sentences in different time frames.',

      }
      const firstToken = trimmed.split(/\s+/)[0].toLowerCase();
      return firstToken;
    }

          '3. Assign daily micro-activities: e.g., 15-minute podcast + transcript, 10 new words applied in sentences, 5 discussion questions answered aloud.',
          '4. Schedule weekly review sessions to recycle vocabulary and grammar.',
          '5. Every month, complete a mock speaking or writing task and reflect on progress.'
        ].join('\n')
      },
      {
        title: 'english exam prep',
        keywords: ['ielts', 'toefl', 'pte', 'exam', 'test preparation', 'english exam'],
        reply: (input) => {
          if(input.includes('ielts')){
            return [
              'IELTS preparation roadmap:',
              '• Listening: practice Cambridge past tests, note distractors.',
              '• Reading: skim for gist, scan for details, manage time per passage (~20 minutes).',
              '• Writing: memorize task 1 structures (overview + comparisons) and task 2 templates for opinion/discussion essays.',
              '• Speaking: rehearse 2-minute Part 2 monologues with clear structure (intro, point, example, conclusion).',
              'Schedule weekly mock tests and review band descriptors.'
            ].join('\n');
          }
          return 'Set a study calendar with weekly mock tests, review official scoring rubrics, and rotate skills (listening, reading, writing, speaking) daily. Analyze errors to adjust strategy.';
        }
      },
      {
        title: 'english for specific purposes',
        keywords: ['academic english', 'business english', 'esp', 'english for specific purposes'],
        reply: () => 'Identify domain vocabulary (academic, business, medical), practice genre-specific writing (reports, lab write-ups), and simulate authentic tasks like presentations or negotiations.'
      },
      {
        title: 'motivation and mindset',
        keywords: ['motivation', 'confidence', 'fear', 'anxiety'],
        reply: () => 'To stay motivated, set SMART English goals, celebrate micro-progress, use growth-mindset affirmations, and rotate enjoyable input (songs, films) with deliberate practice.'
      },
      {
        title: 'thanks',
        keywords: ['thanks', 'thank you'],
        reply: () => 'You\'re welcome! Keep exploring English and let me know what you need next.'
      },
      {
        title: 'greeting',
        keywords: ['hello', 'hi', 'hey', 'good morning', 'good evening'],
        reply: () => 'Hello! Ask me anything about English learning, teaching, exams, grammar, or literature.'
      },
      {
        title: 'identity',
        keywords: ['your name', 'who are you', 'what are you'],
        reply: () => 'I\'m Aurora, focused entirely on English language education and related guidance.'
      }
    ];

    const englishCoreSignals = ['english', 'ielts', 'toefl', 'pte', 'exam', 'study', 'education', 'grammar', 'vocabulary', 'literature', 'teach', 'teacher', 'nepal', 'esl', 'eap'];

    function escapeRegExp(str){
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function scoreEntry(entry, input){
      let score = 0;

      entry.keywords.forEach(keyword => {
        const phrasePattern = new RegExp(`\\b${escapeRegExp(keyword)}\\b`, 'i');
        if(phrasePattern.test(input)){
          score += keyword.split(' ').length * 2;
          return;
        }

        if(keyword.includes(' ')){
          const parts = keyword.split(' ');
          const hits = parts.filter(part => new RegExp(`\\b${escapeRegExp(part)}\\b`, 'i').test(input)).length;
          if(hits){
            score += hits * 0.8;
          }
        }else if(input.includes(keyword)){
          score += 0.9;
        }
      });

      return score;
    }

    function bestKnowledgeMatch(input){
      let best = null;
      let bestScore = 0;

      englishKnowledge.forEach(entry => {
        const score = scoreEntry(entry, input);
        if(score > bestScore){
          best = entry;
          bestScore = score;
        }
      });

      return bestScore >= 1 ? best : null;
    }

    function generalEnglishFallback(rawInput){
      const intro = 'Here are some all-round ways to strengthen your English:';
      const body = [
        '• Practice all four skills weekly (listening, speaking, reading, writing) with specific tasks.',
        '• Keep a vocabulary notebook organised by theme and function.',
        '• Review grammar patterns in context, then create mini dialogues that use them.',
        '• Teach someone else what you have learned—explaining concepts cements mastery.',
        '• Rotate resources: books, podcasts, MOOCs, newspapers, and exam papers.'
      ];
      return `${intro}\n${body.join('\n')}\nIf you have a more specific English topic, let me know so I can tailor suggestions.`;
    }

    function outOfDomainFallback(rawInput){
      return [
        `I focus on English-related questions. I\'m not sure how “${rawInput}” connects.`,
        'Ask about grammar, literature, teaching methodologies, exams, or English education in Nepal and worldwide.'
      ].join(' ');
    }

    function getBotResponse(rawInput){
      const command = parseCommand(rawInput);
      if(command){
        if(Object.prototype.hasOwnProperty.call(commandResponses, command)){
          return commandResponses[command];
        }
        return `I don\'t have a guide for the command “${command}”. Try another English command or ask in plain language.`;
      }

      const input = normalize(rawInput);
      const match = bestKnowledgeMatch(input);

      if(match){
        return typeof match.reply === 'function' ? match.reply(input) : match.reply;
      }

      if(input.length <= 3){
        return 'Could you share more detail about the English topic you have in mind?';
      }

      if(englishCoreSignals.some(signal => input.includes(signal))){
        return generalEnglishFallback(rawInput);
      }

      return outOfDomainFallback(rawInput);
    }

    function randomPick(list){
      return list[Math.floor(Math.random() * list.length)];
    }

    function simulateBotResponse(userMessage){
      toggleTypingIndicator(true);
      sendButton.disabled = true;

      const latency = 420 + Math.random() * 900;

      setTimeout(() => {
        const reply = getBotResponse(userMessage);
        appendMessage('bot', reply);
        toggleTypingIndicator(false);
        sendButton.disabled = false;
        userInput.focus();
      }, latency);
    }

    function handleSubmit(optionalPrefilled){
      const message = typeof optionalPrefilled === 'string' ? optionalPrefilled.trim() : userInput.value.trim();
      if(!message){
        return;
      }

      appendMessage('user', message);
      userInput.value = '';
      simulateBotResponse(message);
    }

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      handleSubmit();
    });

    resetChat.addEventListener('click', () => {
      messageList.innerHTML = '';
      initializeConversation();
      userInput.focus();
    });

    document.addEventListener('visibilitychange', () => {
      const isActive = document.visibilityState === 'visible';
      const chip = document.querySelector('.status-chip');
      if(chip){
        chip.textContent = isActive ? 'Online' : 'Away';
        chip.prepend(document.createElement('span'));
      }
    });

    seedQuickReplies();
    initializeConversation();
  </script>
</body>
</html>
